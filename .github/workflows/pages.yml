# Website (GitHub Pages): docs/site mit Logo und Screenshots aus docs/bilder.
# Einmalig in den Repository-Einstellungen: Pages → Build and deployment → Source: „GitHub Actions“.
name: Website
on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'docs/bilder/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/bilder
          cp -r docs/site/. _site/
          cp docs/bilder/anemo-logo.svg docs/bilder/anemo-logo-512.png _site/bilder/
          cp -r docs/bilder/screenshots _site/bilder/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
